name: Release

# Fully automated tagging + release: push to main and if package.json's
# version has no `v<version>` tag yet, build, tag, and publish a GitHub
# Release (changelog from scripts/release-notes.mjs + the packed plugin
# tarball as an asset). The version bump in package.json is the single human
# step; release cadence = version-bump cadence (SemVer-driven).
#
# Policy recap (see README «Development»):
#   - patch (x.y+1): bug fixes, especially issue-anchored ones — release soon,
#     someone is waiting (e.g. the settings.plugin.item fix in v0.6.1)
#   - minor (x+1.y): feature batches, released when the batch lands + CI green
#   - major: breaking contract changes (peerDeps, slot contract, provider API)
#
# The documented `#main` install path delivers every merged commit regardless;
# tags are the immutable "recommended version" snapshots this workflow emits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + full history for changelog
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: released
        run: |
          git fetch --tags origin
          if git tag -l "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Strict quality gate: never publish until the CI run for THIS commit
      # finished green. Branch protection would additionally stop red from
      # landing on main (that forces a PR flow); this gate works with direct
      # pushes and sits one layer downstream — the release always waits for
      # the exact commit's CI result, whatever upstream policy is in place.
      - name: Wait for CI to pass
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="$GITHUB_SHA"
          # 1) Let the ci.yml run for this commit appear (runner/queue lag).
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' || true)
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          [ -n "$RUN_ID" ] || { echo "::error::no ci.yml run found for $SHA within 10 minutes"; exit 1; }
          # 2) Wait for it to reach a terminal conclusion.
          CONCLUSION=""
          for i in $(seq 1 120); do
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion' || true)
            case "$CONCLUSION" in
              success|failure|cancelled|timed_out|action_required|stale|neutral) break ;;
            esac
            sleep 10
          done
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI run $RUN_ID did not pass (conclusion: ${CONCLUSION:-unknown/not finished within 20 minutes}) — release aborted"
            exit 1
          fi
          echo "CI run $RUN_ID passed — proceeding with release"

      - name: Install, build, pack
        if: steps.released.outputs.exists == 'false'
        run: |
          pnpm install
          pnpm build
          pnpm pack --pack-destination .

      - name: Generate release notes
        if: steps.released.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          node scripts/release-notes.mjs "$PREV" "$TAG" > /tmp/notes.md
          echo "--- notes head ---"
          head -5 /tmp/notes.md

      - name: Tag and publish release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Create the tag server-side (no push round-trip needed).
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          # Publish the release at that tag, then attach the packed tarball.
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          gh release upload "$TAG" "dsh-external-dsh-plugin-tavily-${{ steps.version.outputs.version }}.tgz"
          echo "released $TAG"