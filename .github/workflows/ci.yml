name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: typecheck, build, and the in-repo contract test against the
  # dev-time SlotCore (0.2.0-rc.2). Builds first so the artifact checks can run.
  check:
    name: typecheck + build + contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Contract test (dev SlotCore)
        run: pnpm run test:contract

  # The slot contract lives in the published
  # `@deepseek-ai/dsh-client-ui-slots` core per release: the same shipped
  # client bundle must register under the 0.2.x LIST runtime the Plugins page
  # declares (`plugins.item`, identity by `id`). Runs the artifact-level
  # contract test against each real core version.
  slot-contract-matrix:
    name: slot contract vs real SlotCore (${{ matrix.slots }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slots: ['0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Install SlotCore ${{ matrix.slots }} into a scratch prefix
        run: npm install --prefix /tmp/slots-matrix --no-save --no-package-lock @deepseek-ai/dsh-client-ui-slots@${{ matrix.slots }}
      - name: Contract test against SlotCore ${{ matrix.slots }}
        run: SLOTS_PACKAGE_DIR=/tmp/slots-matrix/node_modules pnpm run test:contract

  # Install→serve wiring against real dsh releases (the CLI ships its own
  # platform, so each leg boots a self-consistent runtime). Boots headless,
  # fetches the served client bundle, and asserts the card registration is
  # what actually ships.
  profile-boot:
    name: real profile boot smoke (dsh ${{ matrix.dsh }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Pack the plugin tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      # `npx --package @deepseek-ai/dsh … dsh` hangs on runners (observed
      # `spawnSync /bin/sh ETIMEDOUT` on both legs of run #1: the add step
      # never progressed past npx's CLI install). Install the pinned CLI with
      # pnpm into a scratch prefix and drive its bin directly instead — the
      # flow validated locally on both dsh versions.
      - name: Install dsh CLI ${{ matrix.dsh }}
        run: |
          mkdir -p "$RUNNER_TEMP/dshcli"
          pnpm --dir "$RUNNER_TEMP/dshcli" init > /dev/null 2>&1
          pnpm --dir "$RUNNER_TEMP/dshcli" add "@deepseek-ai/dsh@${{ matrix.dsh }}"
      # Scoped-name pack output: memef1f1y-dsh-plugin-tavily-<version>.tgz.
      # Resolve it at runtime so version bumps never desync the filename
      # (0.6.1 was hardcoded here once and broke the smoke with ENOENT).
      - name: Boot smoke on dsh ${{ matrix.dsh }}
        env:
          DSH_CMD: node ${{ runner.temp }}/dshcli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          export PLUGIN_TGZ=$(ls "$RUNNER_TEMP"/memef1f1y-dsh-plugin-tavily-*.tgz | head -1)
          node tests/profile-boot-smoke.mjs

  # The TRUE user scenario: a real browser applies the plugin's client half
  # against the runtime's slot declaration. Drives first-run onboarding and
  # asserts the LOAD OUTCOME — no "Failed to load plugins" banner in page
  # text, console or page errors. The settings card render sits one click
  # deeper and proved too timing-sensitive to gate on, so it is not part of
  # the check.
  browser-e2e:
    name: real browser E2E (dsh ${{ matrix.dsh }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Pack the plugin tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install dsh CLI ${{ matrix.dsh }}
        run: |
          mkdir -p "$RUNNER_TEMP/dshcli"
          pnpm --dir "$RUNNER_TEMP/dshcli" init > /dev/null 2>&1
          pnpm --dir "$RUNNER_TEMP/dshcli" add "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Browser E2E on dsh ${{ matrix.dsh }}
        env:
          DSH_CMD: node ${{ runner.temp }}/dshcli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          export PLUGIN_TGZ=$(ls "$RUNNER_TEMP"/memef1f1y-dsh-plugin-tavily-*.tgz | head -1)
          # The load-outcome gate (no "Failed to load plugins" banner) is the
          # deterministic symptom check for issue #1. Headless Chrome can stall
          # for unrelated environmental reasons, so: OS-level `timeout` per
          # attempt (ubuntu runners have it) plus one retry for environment
          # flake — genuine loader-failure markers still fail both attempts.
          for i in 1 2; do
            timeout 300 node tests/browser-e2e.mjs && exit 0
            echo "browser E2E attempt $i failed (exit $?)"
          done
          exit 1