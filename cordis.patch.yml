# dsh-plugin-tavily bundle: register the Tavily search provider into the ctx.web seam.
#
# This bundle layer only makes `tavily` AVAILABLE as a search provider. It does not
# override the profile's chosen search provider — select it explicitly with:
#   - id: web
#     config:
#       searchProvider: tavily
# or the `DSH_WEB_SEARCH_PROVIDER=tavily` environment variable.
- insert:
    - id: web-search-tavily
      name: '@dsh-external/dsh-plugin-tavily'
